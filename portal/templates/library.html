<!DOCTYPE html>
<html lang="en" data-tier="{{ theme_tier|default('Explorer') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library - Brandr</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        /* Library video-preview modal -- click any available Finished
           Render card to play it in place, matching the dark modal look
           used elsewhere (Brands, Admin, upgrade modal). Source Video
           cards are unaffected -- those aren't rendered output files. */
        .video-preview-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .video-preview-modal.active { display: flex; }
        .video-preview-modal__content {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            position: relative;
        }
        .video-preview-modal__content video {
            width: 100%;
            max-height: 70vh;
            border-radius: 8px;
            display: block;
            background: #000;
        }
        .video-preview-modal__close {
            position: absolute;
            top: -14px;
            right: -14px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
        }
        .video-preview-modal__title {
            margin-top: 12px;
            color: #EAEAEA;
            font-size: 14px;
            text-align: center;
            word-break: break-word;
        }

        /* Latest Output now opens the same preview modal as every other
           card instead of embedding its own playable <video controls> --
           this overlay is the only visual difference from a plain poster. */
        .latest-output__play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            color: var(--accent);
            background: rgba(0, 0, 0, 0.15);
        }
        .latest-output__play-overlay svg {
            width: 56px;
            height: 56px;
            opacity: 0.85;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
        }
    </style>
</head>
<body class="page-create">
    {% set active_page = 'library' %}
    {% include '_nav.html' %}

    <!-- ===== LIBRARY HERO — Phase 1 redesign =====
         Same visual language as Create (gradient title, tier-accent eyebrow,
         dot-grid atmosphere via body.page-create). Stats are computed
         client-side from the same three API calls the page already needs
         (/api/downloads/recent, /api/outputs/branded, /api/brands) — no new
         endpoints. -->
    <section class="library-hero" aria-labelledby="libraryHeroTitle">
        <div class="library-hero__text">
            <span class="library-hero__eyebrow">Brandr &middot; Your content hub</span>
            <h1 id="libraryHeroTitle" class="library-hero__title">LIBRARY</h1>
            <p class="library-hero__subtitle">Your content. Your brands. Your finished outputs.</p>
        </div>
        <div class="library-stats" id="libraryStats" aria-live="polite">
            <div class="library-stat"><span class="library-stat__value" id="statOutputs">&mdash;</span><span class="library-stat__label">Outputs</span></div>
            <div class="library-stat"><span class="library-stat__value" id="statSource">&mdash;</span><span class="library-stat__label">Source videos</span></div>
            <div class="library-stat"><span class="library-stat__value" id="statBrands">&mdash;</span><span class="library-stat__label">Brands</span></div>
            <div class="library-stat"><span class="library-stat__value" id="statReady">&mdash;</span><span class="library-stat__label">Ready</span></div>
        </div>
    </section>

    <!-- Brand filter rail + search/sort. The brand filter applies to Finished
         Renders only (source videos aren't brand-scoped in the data model —
         a brand is applied at render time, not at download time), so it's a
         no-op while the Source Videos tab is open. -->
    <div class="library-toolbar">
        <div class="library-brand-rail" id="libraryBrandRail">
            <button type="button" class="brand-chip active" data-brand-id="" onclick="setBrandFilter(null, this)">All Brands</button>
            <!-- brand chips injected by renderBrandRail() -->
            <a href="{{ url_for('brands_page') }}" class="brand-chip brand-chip--add">+ Add brand</a>
        </div>
        <div class="library-search-sort">
            <input type="search" id="librarySearch" placeholder="Search videos, renders, or brands..." oninput="onLibrarySearch()">
            <select id="librarySort" onchange="onLibrarySortChange()">
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="brand">Brand (A&ndash;Z)</option>
            </select>
        </div>
    </div>

    <div class="lib-tabs">
        <button type="button" class="lib-tab active" id="tab-renders" onclick="switchTab('renders')">Finished Renders</button>
        <button type="button" class="lib-tab" id="tab-source" onclick="switchTab('source')">Source Videos</button>
    </div>

    <div class="lib-panel active" id="panel-renders">
        <div id="latestOutputMount"></div>
        <div id="renders-content">
            <div class="loading">Loading finished renders...</div>
        </div>
        <div id="saved-content"></div>
    </div>

    <div class="lib-panel" id="panel-source">
        <div id="library-content">
            <div class="loading">Loading your media...</div>
        </div>
    </div>

    <div class="video-preview-modal" id="videoPreviewModal" onclick="if (event.target === this) closeVideoPreview()">
        <div class="video-preview-modal__content">
            <button type="button" class="video-preview-modal__close" onclick="closeVideoPreview()" aria-label="Close">&times;</button>
            <video id="videoPreviewPlayer" controls></video>
            <div class="video-preview-modal__title" id="videoPreviewTitle"></div>
        </div>
    </div>

    <script>
        const FORMAT_LABELS = {
            'vertical_9_16': 'Vertical 9:16',
            'square_1_1': 'Square 1:1',
            'landscape_16_9': 'Landscape 16:9',
        };
        const FORMAT_ASPECT_CLASS = {
            'vertical_9_16': 'aspect-9-16',
            'square_1_1': 'aspect-1-1',
            'landscape_16_9': '',
        };

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatBytes(bytes) {
            if (bytes === null || bytes === undefined) return null;
            const mb = bytes / (1024 * 1024);
            return mb >= 1 ? `${mb.toFixed(1)} MB` : `${Math.max(1, Math.round(bytes / 1024))} KB`;
        }

        function formatRelativeTime(iso) {
            if (!iso) return 'Unknown date';
            const then = new Date(iso).getTime();
            if (Number.isNaN(then)) return 'Unknown date';
            const diffMs = Date.now() - then;
            const mins = Math.floor(diffMs / 60000);
            if (mins < 1) return 'Just now';
            if (mins < 60) return `${mins} minute${mins === 1 ? '' : 's'} ago`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days} day${days === 1 ? '' : 's'} ago`;
            return new Date(iso).toLocaleDateString();
        }

        function switchTab(tab) {
            document.querySelectorAll('.lib-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.lib-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('panel-' + tab).classList.add('active');
        }

        // Click-to-play modal for Finished Render cards. The single
        // "Latest output" card already has its own <video> inline; this
        // gives every OTHER available render the same playback ability
        // instead of just a decorative thumbnail placeholder.
        function openVideoPreview(url, title) {
            const modal = document.getElementById('videoPreviewModal');
            const player = document.getElementById('videoPreviewPlayer');
            const titleEl = document.getElementById('videoPreviewTitle');
            if (!modal || !player) return;
            player.src = url;
            if (titleEl) titleEl.textContent = title || '';
            modal.classList.add('active');
            player.play().catch(() => {});
        }

        function closeVideoPreview() {
            const modal = document.getElementById('videoPreviewModal');
            const player = document.getElementById('videoPreviewPlayer');
            if (!modal || !player) return;
            modal.classList.remove('active');
            player.pause();
            player.removeAttribute('src');
            player.load();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeVideoPreview();
        });

        // ========== Shared state ==========
        let allBrands = [];
        let brandsById = {};
        let allDownloads = [];
        let allOutputs = [];
        let currentBrandFilter = null; // brand_id (number) or null = All Brands
        let currentSort = 'newest';
        let searchQuery = '';
        let selectedRenderFiles = new Set();

        function brandLogoUrl(brandId) {
            return brandId ? `/api/preview/brand-asset/${brandId}/logo` : '';
        }

        // ========== Brands (drives filter rail + Brands stat + per-item logos) ==========
        async function loadBrands() {
            try {
                const res = await fetch('/api/brands');
                if (!res.ok) throw new Error('Failed to load brands');
                const data = await res.json();
                allBrands = data.brands || [];
                brandsById = {};
                allBrands.forEach(b => { brandsById[b.id] = b; });
                renderBrandRail();
                updateStats();
            } catch (err) {
                console.error('[Library] Could not load brands:', err);
                // Non-fatal: filter rail just shows "All Brands" and cards fall back to text-only brand names.
            }
        }

        function renderBrandRail() {
            const rail = document.getElementById('libraryBrandRail');
            const addBtn = rail.querySelector('.brand-chip--add');
            rail.querySelectorAll('.brand-chip:not(.brand-chip--add)').forEach((el, i) => { if (i > 0) el.remove(); });
            allBrands.forEach(brand => {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'brand-chip';
                chip.dataset.brandId = brand.id;
                chip.onclick = () => setBrandFilter(brand.id, chip);
                const logoUrl = brand.logo_path ? brandLogoUrl(brand.id) : '';
                chip.innerHTML = `${logoUrl ? `<img class="brand-chip__logo" src="${logoUrl}" alt="" onerror="this.remove()">` : ''}<span>${escapeHtml(brand.display_name || brand.name)}</span>`;
                rail.insertBefore(chip, addBtn);
            });
        }

        function setBrandFilter(brandId, btn) {
            currentBrandFilter = brandId;
            document.querySelectorAll('.brand-chip:not(.brand-chip--add)').forEach(el => el.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderLatestOutput();
            renderRecentGrid();
            renderSavedGrid();
        }

        // Display name of the selected brand filter, or null for "All Brands".
        // Latest Output, Recent renders, and Saved to Library all read this
        // so the whole page reads as one brand's workspace, not a filter
        // bolted onto one section of a generic dump.
        function currentBrandLabel() {
            if (!currentBrandFilter) return null;
            const b = brandsById[currentBrandFilter];
            return b ? (b.display_name || b.name) : null;
        }

        function onLibrarySearch() {
            searchQuery = document.getElementById('librarySearch').value.trim().toLowerCase();
            renderRecentGrid();
            renderSavedGrid();
            renderSourceGrid();
        }

        function onLibrarySortChange() {
            currentSort = document.getElementById('librarySort').value;
            renderRecentGrid();
            renderSavedGrid();
        }

        function updateStats() {
            document.getElementById('statOutputs').textContent = allOutputs.length >= 200 ? '200+' : String(allOutputs.length);
            document.getElementById('statSource').textContent = allDownloads.length >= 200 ? '200+' : String(allDownloads.length);
            document.getElementById('statBrands').textContent = String(allBrands.length);
            document.getElementById('statReady').textContent = String(allOutputs.filter(o => o.file_available).length);
        }

        // ========== Finished Renders ==========
        async function loadRenderedOutputs() {
            selectedRenderFiles.clear();
            try {
                const response = await fetch('/api/outputs/branded?limit=200');
                if (!response.ok) throw new Error('Failed to load renders');
                const data = await response.json();
                allOutputs = data.outputs || [];
                updateStats();
                renderLatestOutput();
                renderRecentGrid();
                renderSavedGrid();
            } catch (error) {
                document.getElementById('latestOutputMount').innerHTML = '';
                document.getElementById('renders-content').innerHTML = `
                    <div class="library-empty">
                        <div class="icon">&#9888;&#65039;</div>
                        <h2>Could not load renders</h2>
                        <p>${escapeHtml(error.message)}</p>
                        <button class="btn btn-primary" onclick="loadRenderedOutputs()">Try Again</button>
                    </div>
                `;
                document.getElementById('saved-content').innerHTML = '';
            }
        }

        function outputMetaLine(output) {
            const parts = [];
            const dims = output.width && output.height ? `${Math.max(output.width, output.height)}p` : null;
            if (dims) parts.push(dims);
            const size = formatBytes(output.file_size_bytes);
            if (size) parts.push(size);
            return parts.join(' &middot; ');
        }

        function brandBadgeHtml(brandId, brandName, sizeClass) {
            const logo = brandId ? brandLogoUrl(brandId) : '';
            const logoImg = logo ? `<img class="${sizeClass}" src="${logo}" alt="" onerror="this.remove()">` : '';
            return `${logoImg}<span>${escapeHtml(brandName || 'Unknown brand')}</span>`;
        }

        // The single most recent AVAILABLE render -- scoped to the selected
        // brand, same as every other section on the page, so picking a brand
        // turns the whole Library into that brand's workspace instead of only
        // filtering the grid underneath. allOutputs is already newest-first
        // (the API orders by created_at DESC), so the first match IS the
        // latest. Ignores the text search box on purpose: search narrows
        // what you're looking for, it doesn't redefine "the thing you just
        // made". Recent/Saved below exclude this exact render so it never
        // appears twice.
        function getLatestOutput() {
            let list = allOutputs.filter(o => o.file_available);
            if (currentBrandFilter) list = list.filter(o => o.brand_id === currentBrandFilter);
            return list[0] || null;
        }

        function renderLatestOutput() {
            const mount = document.getElementById('latestOutputMount');
            const latest = getLatestOutput();
            const brandLabel = currentBrandLabel();
            const eyebrowText = brandLabel ? `Latest ${brandLabel} output` : 'Latest output';

            if (!latest) {
                mount.innerHTML = brandLabel ? `
                    <div class="latest-output__eyebrow">&#10022; ${escapeHtml(eyebrowText)}</div>
                    <div class="library-empty" style="margin-bottom:var(--space-6, 24px);">
                        <h2>No ${escapeHtml(brandLabel)} outputs yet</h2>
                        <p>Brand a video with ${escapeHtml(brandLabel)} to see it here.</p>
                    </div>
                ` : '';
                return;
            }

            const formatKey = latest.output_format || 'vertical_9_16';
            const formatLabel = FORMAT_LABELS[formatKey] || formatKey;
            const aspectClass = FORMAT_ASPECT_CLASS[formatKey] || '';
            const resLabel = latest.width && latest.height ? `${Math.max(latest.width, latest.height)}p` : null;
            const sizeLabel = formatBytes(latest.file_size_bytes);
            const rawFilename = latest.output_filename || '';
            const title = `${latest.brand_name || 'Unknown brand'} — ${formatLabel}`;
            const sourceLabel = latest.source_display_name || latest.source_filename || 'Unknown source';
            const videoUrl = `/api/videos/download/${encodeURIComponent(latest.output_filename)}`;
            const isBookmarked = latest.bookmarked === 1;
            const previewTitle = escapeHtml(`${latest.brand_name || 'Unknown brand'} \u2014 ${sourceLabel}`).replace(/'/g, "\\'");

            mount.innerHTML = `
                <div class="latest-output__eyebrow">&#10022; ${escapeHtml(eyebrowText)}</div>
                <div class="latest-output-card">
                    <div class="latest-output__media ${aspectClass}" onclick="openVideoPreview('${videoUrl}', '${previewTitle}')" style="cursor:pointer;">
                        <video preload="metadata" muted playsinline src="${videoUrl}"></video>
                        <div class="latest-output__play-overlay" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        </div>
                    </div>
                    <div class="latest-output__info">
                        <div class="latest-output__brand">${brandBadgeHtml(latest.brand_id, latest.brand_name, 'latest-output__brand-logo')}</div>
                        <h2 class="latest-output__title">${escapeHtml(title)}</h2>
                        <p class="latest-output__filename" title="${escapeHtml(rawFilename)}">${escapeHtml(rawFilename)}</p>
                        <p class="latest-output__source">From: ${escapeHtml(sourceLabel)}</p>
                        <div class="latest-output__badges">
                            <span class="format-badge-pill">${escapeHtml(formatLabel)}</span>
                            ${resLabel ? `<span class="format-badge-pill">${resLabel}</span>` : ''}
                            ${sizeLabel ? `<span class="format-badge-pill">${sizeLabel}</span>` : ''}
                        </div>
                        <div class="latest-output__status">&#9679; Ready &middot; ${formatRelativeTime(latest.created_at)}</div>
                        <div class="latest-output__actions">
                            <a class="btn btn-primary" href="${videoUrl}">Download</a>
                            <button class="btn btn-secondary" onclick="useInCreate('${escapeHtml(latest.source_filename || '')}')">Brand again</button>
                            <div class="menu-wrap">
                                <button class="btn btn-secondary" onclick="toggleMoreMenu(this)">&#8942;</button>
                                <div class="more-menu">
                                    <button onclick="toggleRenderBookmark(${latest.id}, this)">${isBookmarked ? 'Unsave' : 'Save'}</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getFilteredSortedOutputs() {
            const latest = getLatestOutput();
            let list = allOutputs.filter(o => !latest || o.id !== latest.id);

            if (currentBrandFilter) {
                list = list.filter(o => o.brand_id === currentBrandFilter);
            }
            if (searchQuery) {
                list = list.filter(o => {
                    const haystack = [o.output_filename, o.brand_name, o.source_display_name, o.source_filename]
                        .filter(Boolean).join(' ').toLowerCase();
                    return haystack.includes(searchQuery);
                });
            }
            list = list.slice().sort((a, b) => {
                if (currentSort === 'oldest') return new Date(a.created_at) - new Date(b.created_at);
                if (currentSort === 'brand') return (a.brand_name || '').localeCompare(b.brand_name || '');
                return new Date(b.created_at) - new Date(a.created_at); // newest (default)
            });
            return list;
        }

        function buildGridToolbar() {
            const toolbar = document.createElement('div');
            toolbar.className = 'library-grid-toolbar';
            toolbar.id = 'renders-toolbar';
            toolbar.innerHTML = `
                <span class="sel-count" id="renders-sel-count">0 selected</span>
                <button class="btn btn-small" id="renders-dl-btn" disabled onclick="downloadSelectedRenders()">Download Selected</button>
                <button class="btn btn-secondary btn-small" onclick="clearRenderSelection()">Clear</button>
                <span class="cap-note">Max 10 files</span>
                <div class="toolbar-error" id="renders-toolbar-error"></div>
            `;
            return toolbar;
        }

        // Shared by Recent renders AND Saved to Library, so every output
        // card -- wherever it's shown -- has identical playback (tap opens
        // the one preview modal) and identical actions. `selectable` turns
        // the batch-download checkbox on/off; Saved is a curated view, not
        // a second batch-download surface, so it renders without one.
        function buildOutputCard(output, { selectable }) {
            const card = document.createElement('div');
            card.className = 'media-card2';

            const formatKey = output.output_format || 'vertical_9_16';
            const formatLabel = FORMAT_LABELS[formatKey] || formatKey;
            const aspectClass = FORMAT_ASPECT_CLASS[formatKey] || '';
            const sourceLabel = output.source_display_name || (output.source_filename ? output.source_filename.replace(/\.mp4$/i, '') : 'Unknown source');
            const fileAvailable = output.file_available !== false;
            const isBookmarked = output.bookmarked === 1;
            const outputFilename = output.output_filename || '';
            const outputId = output.id;
            const metaLine = outputMetaLine(output);
            const previewUrl = `/api/videos/download/${encodeURIComponent(outputFilename)}`;
            const previewTitle = escapeHtml(`${output.brand_name || 'Unknown brand'} \u2014 ${sourceLabel}`).replace(/'/g, "\\'");

            card.innerHTML = `
                <div class="card-thumb ${aspectClass}" ${fileAvailable ? `onclick="openVideoPreview('${previewUrl}', '${previewTitle}')" style="cursor:pointer;"` : ''}>
                    ${selectable ? `<input type="checkbox" class="card-thumb__select" value="${escapeHtml(outputFilename)}"
                           onclick="event.stopPropagation()"
                           onchange="toggleRenderSelection(this)" title="Select for batch download"
                           ${fileAvailable ? '' : 'disabled data-unavailable="true"'}>` : ''}
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    <span class="card-thumb__format">${escapeHtml(formatLabel)}</span>
                    ${!fileAvailable ? '<div class="card-thumb__unavailable">Unavailable</div>' : ''}
                </div>
                <div class="media-card2__body">
                    <div class="media-card2__brand">${brandBadgeHtml(output.brand_id, output.brand_name, 'media-card2__brand-logo')}</div>
                    <div class="media-card2__title">${escapeHtml(sourceLabel)}</div>
                    <div class="media-card2__meta">${metaLine || '&nbsp;'}</div>
                    <div class="media-card2__status ${fileAvailable ? '' : 'unavailable'}" id="bm-label-${outputId}">
                        ${fileAvailable ? `&#9679; Ready &middot; ${formatRelativeTime(output.created_at)}` : '&#9679; Unavailable'}
                    </div>
                </div>
                <div class="media-card2__actions">
                    ${fileAvailable
                        ? `<a href="/api/videos/download/${encodeURIComponent(outputFilename)}" class="btn btn-secondary btn-small">Download</a>`
                        : `<button class="btn btn-secondary btn-small" disabled>Download</button>`
                    }
                    <button class="btn btn-secondary btn-small" id="bm-btn-${outputId}" onclick="toggleRenderBookmark(${outputId}, this)">
                        ${isBookmarked ? 'Unsave' : 'Save'}
                    </button>
                </div>
            `;
            return card;
        }

        function renderRecentGrid() {
            const container = document.getElementById('renders-content');
            const brandLabel = currentBrandLabel();
            if (!allOutputs.length) {
                container.innerHTML = `
                    <div class="library-empty">
                        <div class="icon">&#127916;</div>
                        <h2>No finished renders yet</h2>
                        <p>No finished renders yet. Create one from the Brand Cockpit.</p>
                        <a href="{{ url_for('brand_video') }}" class="btn btn-primary">Go to Brand Cockpit</a>
                    </div>
                `;
                return;
            }

            const items = getFilteredSortedOutputs();
            container.innerHTML = '';

            const countText = document.createElement('p');
            countText.className = 'lib-count';
            countText.textContent = brandLabel
                ? `Recent ${brandLabel} outputs · ${items.length} shown`
                : `Recent renders · ${items.length} shown`;
            container.appendChild(countText);
            container.appendChild(buildGridToolbar());

            if (!items.length) {
                const empty = document.createElement('div');
                empty.className = 'library-empty';
                empty.innerHTML = brandLabel
                    ? `<h2>No ${escapeHtml(brandLabel)} renders match this filter</h2><p>Try a different brand, or clear your search.</p>`
                    : `<h2>No renders match this filter</h2><p>Try a different brand, or clear your search.</p>`;
                container.appendChild(empty);
                updateRendersToolbar();
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'card-grid';
            items.forEach(output => grid.appendChild(buildOutputCard(output, { selectable: true })));
            container.appendChild(grid);
            updateRendersToolbar();
        }

        // ========== Saved to Library ==========
        // "Saved" is NOT a separate collection -- there is only one
        // branded_outputs table, and Save/Unsave just flips its `bookmarked`
        // column. So a saved render already carries the same brand_id as
        // everything else here; this view is purely a filter over allOutputs,
        // same data the Recent grid reads, never a second data source to
        // keep in sync.
        function getSavedOutputs() {
            const latest = getLatestOutput();
            let list = allOutputs.filter(o => o.bookmarked === 1 && (!latest || o.id !== latest.id));
            if (currentBrandFilter) {
                list = list.filter(o => o.brand_id === currentBrandFilter);
            }
            if (searchQuery) {
                list = list.filter(o => {
                    const haystack = [o.output_filename, o.brand_name, o.source_display_name, o.source_filename]
                        .filter(Boolean).join(' ').toLowerCase();
                    return haystack.includes(searchQuery);
                });
            }
            list = list.slice().sort((a, b) => {
                if (currentSort === 'oldest') return new Date(a.created_at) - new Date(b.created_at);
                if (currentSort === 'brand') return (a.brand_name || '').localeCompare(b.brand_name || '');
                return new Date(b.created_at) - new Date(a.created_at);
            });
            return list;
        }

        function renderSavedGrid() {
            const container = document.getElementById('saved-content');
            if (!container) return;
            if (!allOutputs.length) { container.innerHTML = ''; return; }

            const brandLabel = currentBrandLabel();
            const items = getSavedOutputs();
            container.innerHTML = '';

            const countText = document.createElement('p');
            countText.className = 'lib-count';
            countText.textContent = brandLabel
                ? `Saved ${brandLabel} outputs · ${items.length} shown`
                : `Saved to Library · ${items.length} shown`;
            container.appendChild(countText);

            if (!items.length) {
                const empty = document.createElement('div');
                empty.className = 'library-empty';
                empty.innerHTML = brandLabel
                    ? `<p>No saved ${escapeHtml(brandLabel)} outputs yet. Tap Save on a ${escapeHtml(brandLabel)} render to keep it here.</p>`
                    : `<p>Nothing saved yet. Tap Save on any render to keep it here.</p>`;
                container.appendChild(empty);
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'card-grid';
            items.forEach(output => grid.appendChild(buildOutputCard(output, { selectable: false })));
            container.appendChild(grid);
        }

        function toggleMoreMenu(btn) {
            const menu = btn.nextElementSibling;
            const wasOpen = menu.classList.contains('open');
            document.querySelectorAll('.more-menu.open').forEach(m => m.classList.remove('open'));
            if (!wasOpen) menu.classList.add('open');
        }
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.menu-wrap')) {
                document.querySelectorAll('.more-menu.open').forEach(m => m.classList.remove('open'));
            }
        });

        function toggleRenderSelection(cb) {
            const filename = cb.value;
            if (cb.checked) {
                selectedRenderFiles.add(filename);
            } else {
                selectedRenderFiles.delete(filename);
            }
            const card = cb.closest('.media-card2');
            if (card) card.classList.toggle('selected', cb.checked);
            updateRendersToolbar();
        }

        function updateRendersToolbar() {
            const count = selectedRenderFiles.size;
            const countEl = document.getElementById('renders-sel-count');
            const dlBtn = document.getElementById('renders-dl-btn');
            if (countEl) countEl.textContent = count === 0 ? '0 selected' : `${count} selected`;
            if (dlBtn) dlBtn.disabled = count === 0;
            const cbs = document.querySelectorAll('.card-thumb__select');
            cbs.forEach(cb => { if (!cb.checked && !cb.dataset.unavailable) cb.disabled = count >= 10; });
            const errEl = document.getElementById('renders-toolbar-error');
            if (errEl) errEl.textContent = '';
        }

        function clearRenderSelection() {
            selectedRenderFiles.clear();
            document.querySelectorAll('.card-thumb__select').forEach(cb => {
                cb.checked = false;
                if (!cb.dataset.unavailable) cb.disabled = false;
            });
            document.querySelectorAll('.media-card2.selected').forEach(c => c.classList.remove('selected'));
            updateRendersToolbar();
        }

        async function downloadSelectedRenders() {
            const files = [...selectedRenderFiles];
            if (files.length === 0) return;
            const dlBtn = document.getElementById('renders-dl-btn');
            const errEl = document.getElementById('renders-toolbar-error');
            if (dlBtn) { dlBtn.disabled = true; dlBtn.textContent = 'Preparing…'; }
            if (errEl) errEl.textContent = '';
            try {
                const res = await fetch('/api/videos/download-zip', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files })
                });
                if (!res.ok) {
                    let msg = `Download failed (${res.status})`;
                    try { const err = await res.json(); msg = err.message || err.error || msg; } catch {}
                    if (errEl) errEl.textContent = msg;
                    return;
                }
                const disposition = res.headers.get('Content-Disposition') || '';
                const match = disposition.match(/filename="?([^";]+)"?/);
                const zipName = match ? match[1] : 'brandr_selected_outputs.zip';
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = zipName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (err) {
                if (errEl) errEl.textContent = `Download failed: ${err.message}`;
            } finally {
                if (dlBtn) {
                    dlBtn.disabled = selectedRenderFiles.size === 0;
                    dlBtn.textContent = 'Download Selected';
                }
            }
        }

        async function toggleRenderBookmark(outputId, btn) {
            if (btn) btn.disabled = true;
            try {
                const res = await fetch(`/api/outputs/${outputId}/bookmark`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (!res.ok) {
                    alert(data.error || 'Could not save render.');
                    if (btn) btn.disabled = false;
                    return;
                }
                const isNowBookmarked = data.bookmarked === 1;
                // Keep the in-memory record in sync so a re-render (search/sort/filter)
                // doesn't revert the button label.
                const rec = allOutputs.find(o => o.id === outputId);
                if (rec) rec.bookmarked = isNowBookmarked ? 1 : 0;
                if (btn) {
                    btn.textContent = isNowBookmarked ? 'Unsave' : 'Save';
                    btn.disabled = false;
                }
                renderSavedGrid();
            } catch (err) {
                console.error('[RenderBookmark] Error:', err);
                if (btn) { btn.disabled = false; btn.textContent += ' ⚠'; }
            }
        }

        // ========== Source Videos ==========
        async function loadLibrary() {
            try {
                const response = await fetch('/api/downloads/recent?limit=200');
                if (!response.ok) throw new Error('Failed to load library');
                const data = await response.json();
                allDownloads = data.downloads || [];
                updateStats();
                renderSourceGrid();
            } catch (error) {
                document.getElementById('library-content').innerHTML = `
                    <div class="library-empty">
                        <div class="icon">&#9888;&#65039;</div>
                        <h2>Could not load library</h2>
                        <p>${escapeHtml(error.message)}</p>
                        <button class="btn btn-primary" onclick="loadLibrary()">Try Again</button>
                    </div>
                `;
            }
        }

        function renderSourceGrid() {
            const container = document.getElementById('library-content');
            if (allDownloads.length === 0) {
                container.innerHTML = `
                    <div class="library-empty">
                        <div class="icon">&#128193;</div>
                        <h2>No media yet</h2>
                        <p>Download some content to see it here</p>
                        <a href="{{ url_for('download') }}" class="btn btn-primary">Get New Media</a>
                    </div>
                `;
                return;
            }

            let items = allDownloads;
            if (searchQuery) {
                items = items.filter(d => {
                    const haystack = [d.display_name, d.filename, d.source_url].filter(Boolean).join(' ').toLowerCase();
                    return haystack.includes(searchQuery);
                });
            }

            container.innerHTML = '';
            const countText = document.createElement('p');
            countText.className = 'lib-count';
            countText.textContent = allDownloads.length >= 200
                ? 'Showing latest 200 source videos'
                : `Showing ${items.length} of ${allDownloads.length} source video${allDownloads.length === 1 ? '' : 's'}`;
            container.appendChild(countText);

            if (!items.length) {
                const empty = document.createElement('div');
                empty.className = 'library-empty';
                empty.innerHTML = `<h2>No source videos match your search</h2>`;
                container.appendChild(empty);
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'card-grid';

            items.forEach(download => {
                const card = document.createElement('div');
                card.className = 'media-card2';

                const filename = download.display_name || download.filename || 'Unknown file';
                const sourceUrl = download.source_url || '';
                const truncatedUrl = sourceUrl.length > 50 ? sourceUrl.substring(0, 50) + '...' : sourceUrl;
                const isAvailable = download.file_exists;
                const isBookmarked = download.bookmarked === 1;
                const downloadId = download.id;

                card.innerHTML = `
                    <div class="card-thumb">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                        <span class="card-thumb__format">SOURCE VIDEO</span>
                        ${!isAvailable ? '<div class="card-thumb__unavailable">File missing</div>' : ''}
                    </div>
                    <div class="media-card2__body">
                        <div class="media-card2__title" id="fn-${downloadId}">${escapeHtml(filename)}</div>
                        <div class="rename-area" id="ra-${downloadId}" style="display:none;">
                            <input type="text" id="ri-${downloadId}" maxlength="80"
                                   style="width:100%;box-sizing:border-box;margin-bottom:4px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:6px;color:#fff;padding:6px 8px;font-size:13px;"
                                   placeholder="Enter display name"
                                   onkeydown="if(event.key==='Enter')saveRename(${downloadId});else if(event.key==='Escape')cancelRename(${downloadId});">
                            <div style="display:flex;gap:6px;margin-bottom:4px;">
                                <button class="btn btn-small" onclick="saveRename(${downloadId})">Save</button>
                                <button class="btn btn-secondary btn-small" onclick="cancelRename(${downloadId})">Cancel</button>
                            </div>
                            <div id="re-${downloadId}" style="font-size:11px;color:#ff9800;display:none;margin-top:2px;"></div>
                        </div>
                        <div class="media-card2__meta">${escapeHtml(truncatedUrl)}</div>
                        <div class="media-card2__meta">Added ${formatRelativeTime(download.created_at)}</div>
                        <button type="button" class="source-card__cta" onclick="useInCreate('${escapeHtml(download.filename || '')}')" ${isAvailable ? '' : 'disabled'}>Brand this video &rarr;</button>
                    </div>
                    <div class="media-card2__actions">
                        <button class="btn btn-secondary btn-small" onclick="toggleLibraryBookmarkFull(${downloadId}, this)">
                            ${isBookmarked ? 'Unsave' : 'Save'}
                        </button>
                        ${download.file_path ? `<a href="/api/videos/download-original/${download.id}" class="btn btn-secondary btn-small">Download</a>` : ''}
                        <button class="btn btn-secondary btn-small" id="rb-${downloadId}" onclick="startRename(${downloadId})">Rename</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            container.appendChild(grid);
        }

        function useInCreate(filename) {
            sessionStorage.setItem('lastDownloadFilename', filename);
            window.location.href = "{{ url_for('brand_video') }}";
        }

        // Patch 47A: Source video inline rename — display_name only, raw filename never changes.
        function startRename(downloadId) {
            const fnDiv = document.getElementById('fn-' + downloadId);
            const ra    = document.getElementById('ra-' + downloadId);
            const ri    = document.getElementById('ri-' + downloadId);
            const rb    = document.getElementById('rb-' + downloadId);
            const re    = document.getElementById('re-' + downloadId);
            if (!fnDiv || !ra || !ri) return;
            ri.value = fnDiv.textContent;
            if (re) { re.style.display = 'none'; re.textContent = ''; }
            fnDiv.style.display = 'none';
            ra.style.display = 'block';
            if (rb) rb.disabled = true;
            ri.focus();
            ri.select();
        }

        function cancelRename(downloadId) {
            const fnDiv = document.getElementById('fn-' + downloadId);
            const ra    = document.getElementById('ra-' + downloadId);
            const rb    = document.getElementById('rb-' + downloadId);
            if (fnDiv) fnDiv.style.display = '';
            if (ra)    ra.style.display = 'none';
            if (rb)    rb.disabled = false;
        }

        async function saveRename(downloadId) {
            const ri      = document.getElementById('ri-' + downloadId);
            const re      = document.getElementById('re-' + downloadId);
            const fnDiv   = document.getElementById('fn-' + downloadId);
            const area    = document.getElementById('ra-' + downloadId);
            const saveBtn = area ? area.querySelector('button') : null;
            if (!ri || !re || !fnDiv) return;

            const name = ri.value.trim();

            if (!name) {
                re.textContent = 'Name cannot be empty.';
                re.style.display = 'block';
                return;
            }
            if (name.length > 80) {
                re.textContent = 'Name must be 80 characters or fewer.';
                re.style.display = 'block';
                return;
            }
            if (/[/\\]/.test(name)) {
                re.textContent = 'Name cannot contain / or \\.';
                re.style.display = 'block';
                return;
            }
            if (/[\x00-\x1f\x7f]/.test(name)) {
                re.textContent = 'Name contains invalid characters.';
                re.style.display = 'block';
                return;
            }

            if (saveBtn) saveBtn.disabled = true;
            re.style.display = 'none';

            try {
                const res = await fetch(`/api/downloads/${downloadId}/rename`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ display_name: name })
                });
                const data = await res.json();
                if (!res.ok) {
                    re.textContent = data.error || 'Rename failed. Please try again.';
                    re.style.display = 'block';
                    if (saveBtn) saveBtn.disabled = false;
                    return;
                }
                fnDiv.textContent = data.display_name || name;
                const rec = allDownloads.find(d => d.id === downloadId);
                if (rec) rec.display_name = data.display_name || name;
                cancelRename(downloadId);
            } catch (err) {
                re.textContent = 'Network error. Please try again.';
                re.style.display = 'block';
                if (saveBtn) saveBtn.disabled = false;
            }
        }

        async function toggleLibraryBookmarkFull(downloadId, btn) {
            if (btn) btn.disabled = true;
            try {
                const res = await fetch(`/api/downloads/${downloadId}/bookmark`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (!res.ok) throw new Error('Failed to toggle bookmark');
                const data = await res.json();
                const rec = allDownloads.find(d => d.id === downloadId);
                if (rec) rec.bookmarked = data.bookmarked ? 1 : 0;
                if (btn) { btn.textContent = data.bookmarked ? 'Unsave' : 'Save'; btn.disabled = false; }
            } catch (err) {
                console.error('[Bookmark] Error:', err);
                if (btn) {
                    btn.disabled = false;
                    const orig = btn.textContent;
                    btn.textContent = orig + ' ⚠';
                    setTimeout(() => { if (btn) btn.textContent = orig; }, 3000);
                }
            }
        }

        // ========== Boot ==========
        loadBrands();
        loadLibrary();
        loadRenderedOutputs();
    </script>
</body>
</html>
